detector: "ALLEGRO"
version: "ALLEGRO_o1_v03"

# Global detector properties
detector_parameters:
  magnetic_field_tesla: 2.0
  max_pseudorapidity: 0.88
  sigma_multiplier: 3.0

# Subdetector-specific properties and readout configs
subdetectors:
  drift_chamber:
    total_layers: 112
    superlayer_bit_name: "superlayer"
    layer_bit_name: "layer"
    bitfield_string: "system:5,side:-2,module:8,sensor:8,superlayer:6,layer:8"

collections:
  track_collections:
    - "FittedTracks"
    - "FittedTracksWithFilteredHits"
  mc_particles: "MCParticles"
  dch_digis: "DCHDigis"
  vtx_digis:
    - "VTXBDigis"
    - "VTXDDigis"
  si_wrapper_digis:
    - "SiWrBDigis"
    - "SiWrDDigis"
  dch_dndx: "DCHdNdxCollection"
  track_mc_assoc: "TracksFromGenParticlesAssociation"
  topoclusters:
    - "AugmentedCaloTopoClusters"
    - "AugmentedCaloClusters"
  ecal_barrel_hits: "ECalBarrelModuleThetaMergedPositioned"
  ecal_endcap_hits: "ECalEndcapTurbinePositioned"
  hcal_endcap_hits: "HCalEndcapReadoutPositioned"

plots:
  - key: "vtx_digi_hits_per_event"
    title: ";Vertex Detector Hits per Event;Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "vertex"
    algorithm: "silicon_pixel"
    module_type: "barrel_endcap"
    eta_gated: true

  - key: "siwr_digi_hits_per_event"
    title: ";Silicon Wrapper Hits per Event;Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "tracking"
    algorithm: "silicon_wrapper"
    module_type: "barrel_endcap"
    eta_gated: true

  - key: "drift_chamber_hits_per_layer"
    title: ";Number of Hits per Layer;Entries"
    type: "integer"
    per_collection: false
    subdetector: "tracking"
    algorithm: "drift_chamber"
    module_type: "barrel"
    eta_gated: true

  - key: "dch_dndx_value"
    title: ";Drift Chamber dN/dx Measurement;Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "tracking"
    algorithm: "drift_chamber"
    module_type: "barrel"
    eta_gated: false

  - key: "tracker_hits_per_track"
    title: ";Number of Tracker Hits per Track;Entries"
    type: "asymmetric"
    per_collection: true
    subdetector: "tracking"
    algorithm: "track_reconstruction"
    module_type: "global"
    eta_gated: true

  - key: "reconstructed_tracks_per_event"
    title: ";Reconstructed Tracks per Event;Entries"
    type: "integer"
    per_collection: true
    subdetector: "tracking"
    algorithm: "track_reconstruction"
    module_type: "global"
    eta_gated: false

  - key: "track_fit_chi2_over_ndf"
    title: ";Track Fit Quality #chi^{2} / ndf;Entries"
    type: "asymmetric"
    per_collection: true
    subdetector: "tracking"
    algorithm: "track_reconstruction"
    module_type: "global"
    eta_gated: false

  - key: "momentum_resolution"
    title: ";Momentum Resolution (p_{reco} - p_{true}) / p_{true};Entries"
    type: "symmetric"
    per_collection: true
    subdetector: "tracking"
    algorithm: "track_reconstruction"
    module_type: "global"
    eta_gated: false

  - key: "track_impact_parameter_d0"
    title: ";Transverse Impact Parameter d_{0} [mm];Entries"
    type: "symmetric"
    per_collection: true
    subdetector: "tracking"
    algorithm: "track_reconstruction"
    module_type: "global"
    eta_gated: false

  - key: "ecal_cell_hits_per_event"
    title: ";LAr ECal Cell Hits per Event;Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "calorimetry"
    algorithm: "lar_calorimeter"
    module_type: "barrel_endcap"
    eta_gated: false

  - key: "total_calo_energy_linearity"
    title: ";Calorimeter Energy Linearity E_{total,reco} / E_{true};Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "calorimetry"
    algorithm: "lar_calorimeter"
    module_type: "combined"
    eta_gated: false

  - key: "ecal_shower_fraction"
    title: ";EM Shower Containment Ratio (E_{ECal} / E_{total});Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "calorimetry"
    algorithm: "lar_calorimeter"
    module_type: "barrel"
    eta_gated: false

  - key: "topocluster_count"
    title: ";Number of TopoClusters per Event;Entries"
    type: "integer"
    per_collection: false
    subdetector: "calorimetry"
    algorithm: "topocluster"
    module_type: "global"
    eta_gated: false

  - key: "topocluster_truth_response"
    title: ";Leading TopoCluster Truth Response (E_{cluster} / E_{true});Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "calorimetry"
    algorithm: "topocluster"
    module_type: "global"
    eta_gated: false

  - key: "track_ep_ratio"
    title: ";Track-Cluster E_{cluster} / p_{track};Entries"
    type: "asymmetric"
    per_collection: false
    subdetector: "track_calo_matching"
    algorithm: "particle_flow"
    module_type: "global"
    eta_gated: false
