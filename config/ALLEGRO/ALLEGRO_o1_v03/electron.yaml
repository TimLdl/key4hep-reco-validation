detector: "ALLEGRO"
version: "ALLEGRO_o1_v03"
validation: "electron"

detector_parameters:
  magnetic_field_tesla: 2.0
  sigma_multiplier: 3.0

subdetectors:
  drift_chamber:
    max_pseudorapidity: 0.88
    total_layers: 112
    superlayer_bit_name: "superlayer"
    layer_bit_name: "layer"
    bitfield_string: "system:5,side:-2,module:8,sensor:8,superlayer:6,layer:8"

collections:
  mc_particles: "MCParticles"
  track_collections:
    - "FittedTracks"
    - "FittedTracksWithFilteredHits"
  track_mc_assoc: "TracksFromGenParticlesAssociation"
  vtx_digis:
    - "VTXBDigis"
    - "VTXDDigis"
  si_wrapper_digis:
    - "SiWrBDigis"
    - "SiWrDDigis"
  topoclusters:
    - "AugmentedCaloTopoClusters"
    - "AugmentedCaloClusters"
  ecal_barrel_hits: "ECalBarrelModuleThetaMergedPositioned"
  ecal_endcap_hits: "ECalEndcapTurbinePositioned"
  hcal_endcap_hits: "HCalEndcapReadoutPositioned"

plots:
  - key: "vtx_digi_hits_per_event"
    title: "Vertex Detector Hits per Event"
    x_title: "Vertex Detector Hits per Event"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 50.0
    per_collection: false
    system: "vertex"
    apply_eta_cut: true

  - key: "siwr_digi_hits_per_event"
    title: "Silicon Wrapper Hits per Event"
    x_title: "Silicon Wrapper Hits per Event"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 50.0
    per_collection: false
    system: "tracking"
    apply_eta_cut: true

  - key: "tracker_hits_per_track"
    title: "Tracker Hits per Track"
    x_title: "Number of Tracker Hits per Track"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 125.0
    per_collection: true
    system: "tracking"
    apply_eta_cut: true

  - key: "reconstructed_tracks_per_event"
    title: "Reconstructed Tracks per Event"
    x_title: "Reconstructed Tracks per Event"
    type: "integer"
    bins: 10
    xmin: 0.0
    xmax: 5.0
    per_collection: true
    system: "tracking"
    apply_eta_cut: false

  - key: "track_fit_chi2_over_ndf"
    title: "Track Fit Quality #chi^{2} / ndf"
    x_title: "#chi^{2} / ndf"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 10.0
    per_collection: true
    system: "tracking"
    apply_eta_cut: false

  - key: "momentum_resolution"
    title: "Momentum Resolution (p_{reco} - p_{true}) / p_{true}"
    x_title: "(p_{reco} - p_{true}) / p_{true}"
    type: "symmetric"
    bins: 10
    xmin: -0.25
    xmax: 0.25
    per_collection: true
    system: "tracking"
    apply_eta_cut: false

  - key: "track_impact_parameter_d0"
    title: "Transverse Impact Parameter d_{0} [mm]"
    x_title: "Transverse Impact Parameter d_{0} [mm]"
    type: "symmetric"
    bins: 10
    xmin: -1.0
    xmax: 1.0
    per_collection: true
    system: "tracking"
    apply_eta_cut: false

  - key: "ecal_cell_hits_per_event"
    title: "LAr ECal Cell Hits per Event"
    x_title: "LAr ECal Cell Hits per Event"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 1000.0
    per_collection: false
    system: "calorimetry"
    apply_eta_cut: false

  - key: "total_calo_energy_linearity"
    title: "Calorimeter Energy Linearity E_{total,reco} / E_{true}"
    x_title: "E_{total,reco} / E_{true}"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 2.0
    per_collection: false
    system: "calorimetry"
    apply_eta_cut: false

  - key: "ecal_shower_fraction"
    title: "EM Shower Containment Ratio (E_{ECal} / E_{total})"
    x_title: "E_{ECal} / E_{total}"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 1.1
    per_collection: false
    system: "calorimetry"
    apply_eta_cut: false

  - key: "topocluster_count"
    title: "Number of TopoClusters per Event"
    x_title: "Number of TopoClusters per Event"
    type: "integer"
    bins: 40
    xmin: 0.0
    xmax: 100.0
    per_collection: false
    system: "calorimetry"
    apply_eta_cut: false

  - key: "topocluster_truth_response"
    title: "Leading TopoCluster Truth Response (E_{cluster} / E_{true})"
    x_title: "E_{cluster} / E_{true}"
    type: "asymmetric"
    bins: 40
    xmin: 0.0
    xmax: 2.0
    per_collection: false
    system: "calorimetry"
    apply_eta_cut: false

  - key: "track_ep_ratio"
    title: "Track-Cluster E_{cluster} / p_{track}"
    x_title: "E_{cluster} / p_{track}"
    type: "asymmetric"
    bins: 10
    xmin: 0.0
    xmax: 2.0
    per_collection: false
    system: "track_calo_matching"
    apply_eta_cut: false

processors:
  - "detectors.ALLEGRO.ALLEGRO_o1_v03.processors.process_silicon_occupancy"
  - "detectors.ALLEGRO.ALLEGRO_o1_v03.processors.process_topoclusters"
  - "detectors.ALLEGRO.ALLEGRO_o1_v03.processors.process_calorimetry"
  - "detectors.ALLEGRO.ALLEGRO_o1_v03.processors.process_track_reconstruction"
  - "detectors.ALLEGRO.ALLEGRO_o1_v03.processors.process_track_cluster_matching"
