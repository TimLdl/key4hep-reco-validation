variables:
    GEOMETRY:
        value: CLIC_o3_v15
        description: Which geometry to use
    NUMBER_OF_EVENTS:
        value: "25"
        description: How many events to run on
    WORKAREA:
        value: /cvmfs/validation
        description: Where to run the validation on the runner
    EVENTS_PER_FILE:
        value: "25"
        description: How many events each input files has
    MAKE_REFERENCE_SAMPLE:
        value: "no"
        description: Whether to only make a reference sample for later use

stages:
    - setup
    - simulate
    - reconstruct
    - make-plot-files
    - plot
    - deploy

.template-job: &template-job
    image: gitlab-registry.cern.ch/key4hep/k4-deploy/alma9-build
    tags:
        - alma9

.template-deploy-job: &template-deploy-job
    image: gitlab-registry.cern.ch/ci-tools/ci-web-deployer:latest
    tags:
        - alma9
    
prepare:
    <<: *template-job
    stage: setup
    script: |
        ls -lah
        mkdir -p $WORKAREA
        cd $WORKAREA
        rel=$(find /cvmfs/sw-nightlies.hsf.org/key4hep/releases/ -maxdepth 3 -name ".spack-commit" | sort -r | head -1)
        rel=$(dirname $rel)
        echo rel is $rel
        source $(ls -t1 $rel/key4hep-stack/*/setup.sh | head -1)

        # rm trackvalidation CLICPerformance key4hep-reco-validation -rf
        git clone https://github.com/jmcarcell/trackvalidation --depth 1
        git clone https://github.com/iLCSoft/CLICPerformance --depth 1
        git clone https://github.com/key4hep/key4hep-reco-validation --depth 1
        # Copy the geometry locally, avoid possible issues with equal signs in the path
        path=$(find ${LCGEO} -name ${GEOMETRY} -type d)
        cp $path . -r

simulation:
    <<: *template-job
    stage: simulate
    script: |
        cd $WORKAREA
        rel=$(find /cvmfs/sw-nightlies.hsf.org/key4hep/releases/ -maxdepth 3 -name ".spack-commit" | sort -r | head -1)
        rel=$(dirname $rel)
        echo rel is $rel
        source $(ls -t1 $rel/key4hep-stack/*/setup.sh | head -1)

        job_commands=()
        ary=$(ls key4hep-reco-validation/data/Z* | head -n $(($NUMBER_OF_EVENTS / $EVENTS_PER_FILE)) )
        ary=($ary)
        for ((i=0; i<${#ary[*]}; i++)); do
            echo $i
            echo ${ary[i]}
            job_commands+=("ddsim --compactFile ${GEOMETRY}/${GEOMETRY}.xml --outputFile sim$i.slcio --steeringFile CLICPerformance/clicConfig/clic_steer.py --inputFiles ${ary[i]} --numberOfEvents $EVENTS_PER_FILE")
        done
        run_job() {
            eval "$1"
        }
        export -f run_job
        parallel -j $(nproc) run_job ::: "${job_commands[@]}"
        lcio_merge_files sim.slcio sim*.slcio

reconstruction:
    <<: *template-job
    stage: reconstruct
    script: |
        cd $WORKAREA
        rel=$(find /cvmfs/sw-nightlies.hsf.org/key4hep/releases/ -maxdepth 3 -name ".spack-commit" | sort -r | head -1)
        rel=$(dirname $rel)
        echo rel is $rel
        source $(ls -t1 $rel/key4hep-stack/*/setup.sh | head -1)

        cd CLICPerformance/clicConfig
        Marlin clicReconstruction.xml --InitDD4hep.DD4hepXMLFile=../../${GEOMETRY}/${GEOMETRY}.xml --global.LCIOInputFiles=../../sim.slcio
        mv Output_DST.slcio Output_REC.slcio histograms.root ../../

make-plot-files:
    <<: *template-job
    stage: make-plot-files
    when: always
    script: |
        cd $WORKAREA
        rel=$(find /cvmfs/sw-nightlies.hsf.org/key4hep/releases/ -maxdepth 3 -name ".spack-commit" | sort -r | head -1)
        rel=$(dirname $rel)
        echo rel is $rel
        source $(ls -t1 $rel/key4hep-stack/*/setup.sh | head -1)

        # Jets
        sed -ie 's/TightSelectedPandoraPFOs/PandoraPFOs/' CLICPerformance/Calorimetry/testCalibJetStudies.xml
        sed -ie "s|/eos.*|$PWD/Output_DST.slcio|" CLICPerformance/Calorimetry/testCalibJetStudies.xml
        Marlin CLICPerformance/Calorimetry/testCalibJetStudies.xml

        # Track validation
        cat << EOF > trackvalidation/cfg/run_script_analysis.json
        {
        "Release date" : "2020-02-07",
        "Input folder" : "$PWD/",
        "Output folder": "./",

        "Ntuple types" : ["ttbar3TeV"],
        "Ntuple names" : ["histograms.root"],
        "Histo names"  : ["track_validation_hist.root"],
        "Test Mode": 1
        }
        EOF

        cd trackvalidation/run_analysis
        python3 script_analysis.py ../cfg/run_script_analysis.json
        cd -


plots:
    <<: *template-job
    stage: plot
    rules:       
        - if: '$MAKE_REFERENCE_SAMPLE == "no"'
    script: |
        mkdir -p ~/.config/matplotlib
        cp matplotlibrc ~/.config/matplotlib
        cd $WORKAREA
        rel=$(find /cvmfs/sw-nightlies.hsf.org/key4hep/releases/ -maxdepth 3 -name ".spack-commit" | sort -r | head -1)
        rel=$(dirname $rel)
        echo rel is $rel
        source $(ls -t1 $rel/key4hep-stack/*/setup.sh | head -1)

        # python key4hep-reco-validation/scripts/make_jet_plots.py JetStudy_WW1000_11814_CLIC_o3_v14_CT_PandoraPFOs_testnew.root /eos/home-j/jcarcell/Testing_20/JetStudy_WW1000_11814_CLIC_o3_v14_CT_PandoraPFOs_testnew.root
        python3 key4hep-reco-validation/scripts/make_jet_plots.py JetStudy_WW1000_11814_CLIC_o3_v14_CT_PandoraPFOs_testnew.root /cvmfs/validation_reference_samples/CLIC_o3_v15/JetStudy_WW1000_11814_CLIC_o3_v14_CT_PandoraPFOs_testnew_good.root
        mkdir -p key4hep-reco-validation/www/${GEOMETRY}/jets/plots
        mv *.png key4hep-reco-validation/www/${GEOMETRY}/jets/plots

        python3 key4hep-reco-validation/scripts/make_tracking_plots.py tracking_validation_hist.root trackvalidation/run_analysis/histo_muons_1GeV.root
        mkdir -p key4hep-reco-validation/www/${GEOMETRY}/track_validation/plots
        mv *.png key4hep-reco-validation/www/${GEOMETRY}/track_validation/plots

        cd key4hep-reco-validation/web/python
        python3 make_web.py --dest ../../www
    

# -- Deploy to EOS ----------------------------
# Use the standard workflow to publish to eos
# see https://gitlab.cern.ch/ci-tools/ci-web-deployer
# The variables for this particular deployment:
# CI_OUTPUT_DIR: build/doxygen/html/
# EOS_ACCOUNT_PASSWORD: xxx
# EOS_ACCOUNT_USERNAME: xxx
# EOS_PATH: /eos/project-k/key4hep/www/edm4hep/
# METHOD: rsync
# are set in the repository https://gitlab.cern.ch/key4hep/edm4hep,
# which mirrors https://github.com/key4hep/edm4hep
# In particular, the service account key4hep is used to write
# to the eos space /eos/project/k/key4hep/www/edm4hep
# Other accounts which are part of the e-groups
# cernbox-project-key4hep-{readers|writers} may be used.
# The eos path and website are configured using https://webeos.cern.ch/
deployment:
  <<: *template-deploy-job
  # make sure that changes are deployed only when they are merged to master
  only:
    refs:
      - master
  when: always
  stage: deploy
  script:
    - deploy-eos
  before_script: []
  after_script: []

