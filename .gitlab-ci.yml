variables:
    VERSIONS:
        value: ""
        description: Optional comma-separated detector variants to run. Leave empty to auto-discover all implemented variants from config/.
    MAKE_REFERENCE_SAMPLE:
        value: "no"
        description: Whether to only make a reference sample for later use
    WORKAREA:
        value: "/validation"
        description: Where to run the validation on the runner
    PLOTAREA:
        value: "plots"
        description: Where to store the plots and information for the validation website
    REFERENCE_SAMPLE:
        value: "references"
        description: Where to find the reference sample
    NUMBER_OF_EVENTS:
        value: "100"
        description: How many events to run on
    TAG:
        value: ""
        description: Which tag to use for the release
    EMAIL_ADDRESSES:
        value: "tim.leidel@cern.ch"
        description: Email addresses to send status emails to (separated by comma)
    STEERING_FILE_REPO:
        value: "https://github.com/HEP-FCC/FCC-config.git"
        description: Web URL of the steering file repository to clone
    STEERING_FILE_BRANCH:
        value: "main"
        description: Branch of the FCC-config repository to clone
    CI_OUTPUT_DIR:
        value: "$WORKAREA/$PLOTAREA"
        description: Path to the web page files

stages:
    - setup
    - simulation
    - validation
    - plot
    - web
    - deploy
    - cleanup

# --- Global Blueprint Templates ---
.template-job:
    image: gitlab-registry.cern.ch/key4hep/k4-deploy/alma9-build
    tags:
        - validation
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# --- Pipeline Stages ---
setup:
    extends: .template-job
    stage: setup
    when: always
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    script:
        - bash scripts/k4_reco_val_pipeline_utils/setup.sh

simulation:
    extends: .template-job
    stage: simulation
    when: always
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    script:
        - bash scripts/k4_reco_val_pipeline_utils/simulation.sh

validation:
    extends: .template-job
    stage: validation
    when: always
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    script:
        - bash scripts/k4_reco_val_pipeline_utils/validation.sh

plot:
    extends: .template-job
    stage: plot
    when: always
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: on_success
        - if: '$MAKE_REFERENCE_SAMPLE == "yes"'
          when: never
    script:
        - bash scripts/k4_reco_val_pipeline_utils/plot.sh

web:
    extends: .template-job
    stage: web
    when: on_success
    needs:
        - plot
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: on_success
        - if: '$MAKE_REFERENCE_SAMPLE == "yes"'
          when: never
    script:
        - bash scripts/k4_reco_val_pipeline_utils/web.sh

deployment:
    extends: .template-job
    image: gitlab-registry.cern.ch/ci-tools/ci-web-deployer
    when: on_success
    needs:
        - web
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: never
        - if: '$MAKE_REFERENCE_SAMPLE == "yes"'
          when: never
    stage: deploy
    script:
        - deploy-eos
    before_script: []
    after_script: []

cleanup:
    extends: .template-job
    stage: cleanup
    when: always
    script:
        - bash scripts/k4_reco_val_pipeline_utils/cleanup.sh
